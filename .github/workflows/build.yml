
name: Build Inspecteur Gadget

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm install

      - name: Compiler pour macOS
        if: matrix.platform == 'mac'
        run: npm run dist -- --mac dmg

      - name: Compiler pour Windows
        if: matrix.platform == 'win'
        run: npm run dist -- --win nsis

      - name: Publier les installateurs en artefacts
        uses: actions/upload-artifact@v4
        with:
          name: Inspecteur-Gadget-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publier la version GitHub
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger les compilations
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
